name: Release

# Тег vX.Y.Z → збірки для macOS, Windows і Linux → GitHub Release, з якого застосунок сам оновлюється
# (electron-updater читає latest*.yml). Запуск вручну (workflow_dispatch) лише збирає й зберігає артефакти,
# без релізу — щоб перевірити збірку. Підпис і нотаризація macOS вмикаються, коли задано секрети
# (див. CONTRIBUTING.md → «Релізи»); без них macOS-збірка непідписана й не оновлюється сама.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: kodeida-macos
            artifact_paths: |
              app/release/*.dmg
              app/release/*.dmg.blockmap
              app/release/*.zip
              app/release/*.zip.blockmap
              app/release/latest-mac.yml
          - os: windows-latest
            artifact_name: kodeida-windows
            artifact_paths: |
              app/release/*.exe
              app/release/*.exe.blockmap
              app/release/latest.yml
          - os: ubuntu-latest
            artifact_name: kodeida-linux
            artifact_paths: |
              app/release/*.AppImage
              app/release/latest-linux.yml
    defaults:
      run:
        working-directory: app
    env:
      HAS_MAC_SIGNING: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Engine self-test
        run: npm run selftest

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} ≠ package.json v$v"; exit 1; }

      - name: Import App Store Connect API key (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true'
        run: |
          mkdir -p private_keys
          echo "${APPLE_API_KEY_B64}" | base64 --decode > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Import signing certificate (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CSC_LINK" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          # -k — пароль самого keychain, а не .p12 (як у Mova-Flow: вбудоване налаштування electron-builder
          # на нових раннерах падає з «SecKeychainUnlock … not correct»).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build installer
        shell: bash
        run: npm run dist
        env:
          # Без секретів macOS-збірка свідомо непідписана; Windows і Linux не підписуємо.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true') && 'true' || 'false' }}
          APPLE_API_KEY: ${{ (matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true') && format('private_keys/AuthKey_{0}.p8', secrets.APPLE_API_KEY_ID) || '' }}
          APPLE_API_KEY_ID: ${{ (matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ (matrix.os == 'macos-latest' && env.HAS_MAC_SIGNING == 'true') && secrets.APPLE_API_ISSUER || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/**/*
          generate_release_notes: true
